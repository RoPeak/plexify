repos:
  - repo: local
    hooks:
      - id: plexify-fast-gate
        name: plexify fast local gate
        entry: scripts/run_local_ci.sh fast
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: plexify-pre-push
        name: plexify pre-push pytest gate
        entry: scripts/run_local_ci.sh push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
